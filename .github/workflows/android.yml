name: Build Android app

# Builds a signed APK (for testing) and AAB (for Google Play) and attaches them to the run.
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    base64 of android/keystore/ludo-real-upload.jks
#   KEYSTORE_PASSWORD  the keystore/key password
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install and sync web files
        run: |
          npm ci --ignore-scripts
          npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets"; exit 1; fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/ludo-real-upload.jks
          printf 'storeFile=../keystore/ludo-real-upload.jks\nstorePassword=%s\nkeyAlias=ludoreal\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ludo-real-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
